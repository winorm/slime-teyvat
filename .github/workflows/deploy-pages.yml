name: 构建并发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 让工作流可以发布 Pages（需要 pages: write 和 id-token: write）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布任务，新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

      # 首次使用时要在仓库 Settings → Pages → Source 选「GitHub Actions」，
      # 这一步只是读取 Pages 的配置（工作流的令牌没有权限替仓库打开 Pages）
      - name: 读取 Pages 配置
        uses: actions/configure-pages@v5

      - name: 上传 dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
